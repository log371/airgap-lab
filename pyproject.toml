[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airgap-lab"
version = "0.1.0"
description = "Local-first hardware and Ollama inspection workbench"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1", "psutil>=5.9,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["airgap_lab"]

[tool.setuptools.package-data]
airgap_lab = ["index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
